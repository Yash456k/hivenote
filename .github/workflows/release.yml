name: release
# Pushing a tag like v0.4.0 publishes that version to npm and makes the GitHub release.
# npm trusts this workflow directly (trusted publishing), so there is no token to keep.
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write   # the GitHub release
      id-token: write   # proves to npm that this workflow is the one publishing
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: The tag is the version in package.json, and its commit is on main
        run: |
          version="$(node -p "require('./package.json').version")"
          [ "$GITHUB_REF_NAME" = "v$version" ] || { echo "Tag $GITHUB_REF_NAME does not match package.json version $version"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "Tag $GITHUB_REF_NAME is not on main"; exit 1; }
          grep -q "^## $version\$" CHANGELOG.md || { echo "CHANGELOG.md has no section for $version"; exit 1; }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: node scripts/pack-smoke.mjs
      - run: npm publish
      - name: GitHub release with this version's part of the changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="## $version" '$0 == v { on = 1; next } /^## / { on = 0 } on' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
